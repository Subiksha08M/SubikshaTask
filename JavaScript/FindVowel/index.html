<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./assets/JS/script.js"></script>
    <link rel="stylesheet" href="./CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h4 class="text-primary">Find the vowel or not</h4>
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-12 form-group">
                        <label for="sentence">Enter The Word</label>
                        <input type="text" id="inputField" class="input-lg form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div id="validationError" class="alert alert-danger">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 btn-group">
                        <button class="btn btn-success btn-sm" onclick="findVowelOrNot()">Find</button>
                    </div>
                    <div class="col-6 btn-group">
                        <button class="btn btn-secondary btn-sm" id="resetButton" onclick="reset()">Reset</button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div id="result" class="alert alert-success">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
