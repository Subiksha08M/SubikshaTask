<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./assets/JS/script.js"></script>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/bootstrap.css">
</head>
<body>
    <div class="container">
        <h4 class="text-success">CheckBox</h4>
        <div class="card bg-info-subtle p-4">
            <div class="card-body shadow">
                <form class="ms-2">
                    <div class="row">
                        <div class="col-12 bg-success-subtle">
                            <input type="checkbox" id="checkboxOne" class="checkboxClass form-check-input">
                            <label for="checkboxOne">CheckBoxOne</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 bg-success-subtle">
                            <input type="checkbox" id="checkboxTwo" class="checkboxClass form-check-input">
                            <label for="checkboxTwo">CheckBoxTwo</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 bg-success-subtle">
                            <input type="checkbox" id="checkboxThree" class="checkboxClass form-check-input">
                            <label for="checkboxThree">CheckBoxThree</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 bg-success-subtle">
                            <input type="checkbox" id="checkboxFour" class="checkboxClass form-check-input">
                            <label for="checkboxFour">CheckBoxFour</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 bg-success-subtle">
                            <input type="checkbox" id="checkboxFive" class="checkboxClass form-check-input">
                            <label for="checkboxFive">CheckBoxFive</label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button class="btn btn-success" onclick="checkbox('check')">Check All</button>
                        <button class="btn btn-success" onclick="checkbox('uncheck')">Uncheck All</button>
                        <button class="btn btn-success" onclick="checkbox('toggle')">Toggle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
