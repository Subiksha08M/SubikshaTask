<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./assets/JS/script.js"></script>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/bootstrap.css">
</head>
<body>
    <div class="container">
        <div class="card shadow p-2 bg-primary-subtle">
            <div class="card-body">
                <h4 class="card-title text-primary">Create an array</h4>
                <div class="card-text">
                    <label for="inputField">Input</label>
                    <input type="text" class="form-control" id="inputField">
                    <label for="positionField">Position</label>
                    <input type="text" class="form-control" id="positionField">
                    <label for="newElement">New Element</label>
                    <input type="text" class="form-control" id="newElement">
                    <div id="validationError" class="alert alert-danger mt-2">
                    </div>
                    <div id="result" class="alert alert-success mt-2">
                    </div>
                </div>
            </div>
            <div class="col-12 d-flex justify-content-evenly p-4">
                <button class="btn btn-success" onclick="replaceElement()">Replace</button>
                <button class="btn btn-success" onclick="reset()">Reset</button>
            </div>
        </div>
    </div>
</body>
</html>
